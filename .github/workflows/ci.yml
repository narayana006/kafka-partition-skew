name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run on examples
        run: |
          kafka-partition-skew examples/kafka-log-dirs-3-brokers.txt --end-offsets examples/end-offsets-3-brokers.txt --exit-zero
          kafka-partition-skew examples/kafka-log-dirs-single-broker.txt --min-topic-bytes 0 --format json --exit-zero
          kafka-partition-skew examples/kafka-log-dirs-single-broker.txt
