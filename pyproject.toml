[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-partition-skew"
version = "0.1.0"
description = "Find partition skew, hot brokers and hot disks in Apache Kafka from kafka-log-dirs output"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kafka-partition-skew = "kafka_partition_skew.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/kafka-partition-skew"

[tool.setuptools]
packages = ["kafka_partition_skew"]
